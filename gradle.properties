GROUP=io.github.lumkit
VERSION_NAME=0.1.3
#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
# Local SweetEditor C++ core (sibling checkout by default). Override in local.properties.
sweetEditor.home=../SweetEditor
# Local SweetLine C++ core (sibling checkout by default). Override in local.properties.
sweetLine.home=../SweetLine
# Share SweetEditor cinterop across iosMain / appleMain.
kotlin.mpp.enableCInteropCommonization=true
